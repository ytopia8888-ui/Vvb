
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/gradlew" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find . -name settings.gradle -o -name settings.gradle.kts)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle project with gradlew found."
            echo "Upload the extracted source and Gradle wrapper."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
